[package]
name = "chroma"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A local, template-driven Linux desktop color engine"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
tempfile = "3"
png = "0.18.1"
jpeg-decoder = { version = "0.3.2", default-features = false }

[profile.release]
lto = "thin"
strip = true
