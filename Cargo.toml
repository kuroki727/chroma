[package]
name = "chroma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local, template-driven Linux desktop color engine"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
